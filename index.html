<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کانتر شاپ | CounterShop</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14161c;--mut:#667;--ac:#ff7a1a;--ac2:#ffb347;--bd:#e3e5ec;--ok:#14b86a;--bad:#e5484d;--sh:0 8px 30px #0001;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--card:#151922;--tx:#eef0f6;--mut:#8b93a7;--bd:#232938;--sh:0 8px 30px #0006}}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#151922;--tx:#eef0f6;--mut:#8b93a7;--bd:#232938;--sh:0 8px 30px #0006}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{flex:1;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
.nav{display:flex;gap:4px}
.btn{border:0;cursor:pointer;border-radius:12px;padding:8px 14px;background:var(--bg);border:1px solid var(--bd);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.pri{background:linear-gradient(135deg,var(--ac),#ff4d4d);color:#fff;border:0;font-weight:600}
.btn.on{border-color:var(--ac);color:var(--ac)}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-right:4px}
main{max-width:1200px;margin:auto;padding:14px}
.hero{border-radius:24px;padding:40px 24px;color:#fff;background:radial-gradient(circle at 20% 20%,#ff7a1a99,transparent 50%),linear-gradient(135deg,#1b2033,#0b0d12);position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,44px);font-weight:800}
.hero p{margin:0 0 16px;opacity:.85;max-width:560px}
.stats{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}.stats b{font-size:22px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:var(--sh);transition:.25s;cursor:pointer;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);border-color:var(--ac)}
.pic{height:150px;display:grid;place-items:center;font-size:64px;position:relative}
.tag{position:absolute;top:10px;right:10px;font-size:12px;padding:2px 10px;border-radius:99px;background:#000a;color:#fff}
.tag.low{background:#e5a100}.tag.out{background:var(--bad)}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-weight:800;color:var(--ac)}.mut{color:var(--mut);font-size:13px}
.stars{color:#ffb800;letter-spacing:1px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.x{position:absolute;left:14px;top:14px}
.pd{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}
@media(max-width:640px){.pd{grid-template-columns:1fr}.logo{font-size:16px}.nav .btn span{display:none}}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid var(--bd)}td:first-child{color:var(--mut)}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0}
.rev{border:1px solid var(--bd);border-radius:14px;padding:10px;margin:8px 0}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,100%);background:var(--card);z-index:60;padding:16px;transform:translateX(-100%);transition:.3s;overflow:auto;box-shadow:var(--sh)}
.drawer.on{transform:none}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:8px;background:var(--bg);border-radius:14px;margin:8px 0}
.m{padding:8px 12px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.m.u{background:var(--ac);color:#fff;align-self:flex-start}.m.b{background:var(--card);border:1px solid var(--bd);align-self:flex-end}
.tk{border:1px solid var(--bd);border-radius:14px;padding:10px;margin:6px 0;cursor:pointer;background:var(--card)}
.tk.sel{border-color:var(--ac)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;z-index:99;display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
:root,:root:not([data-theme="light"]){--bg:#07080d;--card:#0e1119;--tx:#eef2ff;--mut:#b4bdd6;--bd:#1f2638;--ac:#00f0ff;--ac2:#ff2bd6;--sh:0 0 0 #0000}
body{background:radial-gradient(circle at 80% -10%,#ff2bd633,transparent 40%),radial-gradient(circle at 0 20%,#00f0ff22,transparent 40%),var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000030 2px 3px);opacity:.18}
.logo{display:flex;align-items:center;gap:8px;font-family:Orbitron,Vazirmatn,sans-serif;letter-spacing:2px;filter:drop-shadow(0 0 8px #00f0ff88)}
.logo svg{width:30px;height:30px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{border:1px solid #00f0ff55;box-shadow:0 0 40px #00f0ff22 inset,0 0 30px #ff2bd622;background:linear-gradient(#0000 94%,#00f0ff22 95%) 0 0/100% 32px,linear-gradient(90deg,#0000 94%,#00f0ff22 95%) 0 0/32px 100%,radial-gradient(circle at 15% 20%,#00f0ff55,transparent 45%),radial-gradient(circle at 90% 90%,#ff2bd666,transparent 45%),#0a0c14}
.hero h1{font-family:Orbitron,Vazirmatn,sans-serif;text-shadow:2px 0 #ff2bd6,-2px 0 #00f0ff;animation:gl 3s infinite}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translate(3px,-1px)}96%{transform:translate(-3px,1px)}}
.pri{background:linear-gradient(135deg,#00f0ff,#7b2bff 55%,#ff2bd6);color:#05060a;font-weight:800;box-shadow:0 0 18px #00f0ff66;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.pri:hover{box-shadow:0 0 28px #ff2bd6aa}
.card{border-radius:6px;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:6px;padding:1px;background:linear-gradient(135deg,#00f0ff,transparent 40%,#ff2bd6);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55;transition:.3s}
.card:hover{box-shadow:0 0 28px #00f0ff55,0 0 60px #ff2bd633;border-color:transparent}
.card:hover::before{opacity:1}
.pic{background-image:linear-gradient(#0000 90%,#00f0ff18 91%),linear-gradient(90deg,#0000 90%,#00f0ff18 91%);background-size:20px 20px}
.pic{font-size:72px;filter:drop-shadow(0 0 14px #00f0ffaa)}
.price{font-family:Orbitron,Vazirmatn,sans-serif;color:#00f0ff;text-shadow:0 0 10px #00f0ff88;font-size:14px}
.tag{border-radius:2px;background:#00f0ff;color:#04050a;font-weight:800}
.btn.on{border-color:#00f0ff;color:#00f0ff;box-shadow:0 0 12px #00f0ff55}
.badge{background:#ff2bd6;box-shadow:0 0 10px #ff2bd6}
.modal,.drawer{border:1px solid #00f0ff66;box-shadow:0 0 40px #00f0ff33}
.m.u{background:linear-gradient(135deg,#7b2bff,#ff2bd6)}
.tick{overflow:hidden;white-space:nowrap;border-block:1px solid var(--bd);margin:0 0 16px;padding:8px 0;font-family:Orbitron,sans-serif;font-size:12px;color:var(--mut)}
.tick div{display:inline-block;padding-left:100%;animation:mq 25s linear infinite}
@keyframes mq{to{transform:translateX(100%)}}
.tick b{color:#00f0ff;margin:0 18px}
.brands{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.brands span{flex:1;min-width:110px;text-align:center;padding:12px 8px;border:1px solid var(--bd);background:var(--card);font-family:Orbitron,sans-serif;font-weight:900;font-size:13px;letter-spacing:2px;transition:.3s}
.brands span:hover{border-color:#ff2bd6;color:#ff2bd6;box-shadow:0 0 16px #ff2bd655}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.nav .ic{font-size:19px}.pic .ic{color:#00f0ff}.hero h2 .ic{color:#00f0ff}.tick .ic{color:#ff2bd6;font-size:15px}

.card{--rc:#00f0ff}.card::before{background:linear-gradient(135deg,var(--rc),transparent 45%,var(--rc))}
.card:hover{box-shadow:0 0 28px color-mix(in srgb,var(--rc) 45%,transparent)}
.pic .ic{color:var(--rc);filter:drop-shadow(0 0 10px var(--rc))}
.pic{background-color:color-mix(in srgb,var(--rc) 10%,transparent)}
@media(max-width:640px){
header{backdrop-filter:none;background:var(--card)}
.bar{flex-wrap:wrap;gap:8px}.search{order:3;flex-basis:100%}.logo{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;justify-content:space-around;background:#0b0e16f2;border-top:1px solid #00f0ff66;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
.nav .btn{flex:1;border:0;background:none;padding:6px 0;text-align:center;clip-path:none}.nav .btn .ic{font-size:24px}
.nav .btn.pri{background:none;box-shadow:none;color:#00f0ff}.nav .btn.on{color:#00f0ff;box-shadow:none;border:0}
.nav .btn span.badge{display:inline-block;position:absolute;margin:-8px 0 0 -6px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px}.nav .btn{position:relative}
main{padding:10px 10px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.pic{height:110px;font-size:54px}.cb{padding:8px}.cb b{font-size:13px}.hero{padding:24px 14px;border-radius:16px}
.ov{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;max-height:90vh;padding:16px}
.drawer{width:100%;padding-bottom:90px}.toast{bottom:90px}
.pd .pic{height:170px!important;font-size:80px!important}}

:root{--fd:Digi,Vazirmatn,sans-serif;--fp:Prom,Vazirmatn,sans-serif;--ft:Tuni,Vazirmatn,sans-serif}
.stats b,.badge,.tag{font-family:var(--fd)}.price{font-family:var(--fp);letter-spacing:.5px}
.hero h1{direction:ltr;text-align:right}.stats b{font-size:34px;color:#00f0ff;text-shadow:0 0 14px #00f0ff}.price{font-size:17px}
h2,h3,.hero h2{font-family:var(--fp);font-weight:400;letter-spacing:.3px}
.btn,.chips .btn,.brands span{font-family:var(--ft)}
.m,.rev,.tk,input,textarea,select{font-family:Vazirmatn,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 30%,#00f0ff22,transparent 40%),radial-gradient(circle at 70% 70%,#ff2bd622,transparent 40%);animation:orb 16s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(5%,-4%) rotate(10deg) scale(1.15)}}
#ld{position:fixed;inset:0;z-index:200;background:#07080d;display:grid;place-content:center;justify-items:center;gap:14px;animation:ldo .6s 1.4s forwards}
#ld svg{width:72px;height:72px;animation:spin 1.6s linear infinite;filter:drop-shadow(0 0 12px #00f0ff)}
#ld b{font-family:Orbitron,sans-serif;letter-spacing:6px;color:#00f0ff}
#ld i{display:block;width:160px;height:3px;background:#1f2638;overflow:hidden}#ld i::after{content:"";display:block;height:100%;background:linear-gradient(90deg,#00f0ff,#ff2bd6);animation:ldb 1.3s ease-out forwards}
@keyframes ldo{to{opacity:0;visibility:hidden}}@keyframes ldb{from{width:0}to{width:100%}}
.hero::before{content:"";position:absolute;left:-70px;top:-70px;width:260px;height:260px;border:2px dashed #00f0ff66;border-radius:50%;animation:spin 22s linear infinite}
.hero::after{content:"";position:absolute;right:8%;bottom:-40px;width:130px;height:130px;border:2px solid #ff2bd666;border-radius:50%;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.8);opacity:0}}
.hero>:not(h1){animation:up .8s .25s cubic-bezier(.2,.8,.2,1) backwards}.hero p{animation-delay:.4s}.hero .stats{animation-delay:.55s}
.hero h1{animation:gl 3s infinite,up .8s .1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.hero .pri{animation:up .8s .5s backwards,glow 2.4s 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px #ff2bd6bb}}
#app.vin{animation:vin .45s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.rv{opacity:0}.rv.in{opacity:1;animation:rvIn .65s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
@keyframes rvIn{from{opacity:0;transform:translateY(30px) scale(.94)}}
.card{transition:transform .2s,box-shadow .3s,border-color .3s;will-change:transform}
.pic{overflow:hidden}.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff26 50%,transparent 60%);transform:translateX(-130%);animation:shine 5s 1s infinite;pointer-events:none}
@keyframes shine{40%,100%{transform:translateX(130%)}}
.pic .ic{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-7px) rotate(-4deg)}}
.card:hover .pic .ic{animation-duration:1.2s;transform:scale(1.1)}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3) rotate(-10deg)}}
.fly{position:fixed;z-index:300;font-size:30px;color:#00f0ff;pointer-events:none;filter:drop-shadow(0 0 8px #00f0ff)}
.chat .m:last-child{animation:pop .3s}.tag.low{animation:pulse2 1.6s infinite}@keyframes pulse2{50%{opacity:.6}}
.badge{animation:pop .4s}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

 const L=S.P.filter(p=>(S.cat==='همه'||p.c===S.cat)&&(p.n+p.c).includes(S.q));
 return `<div class="tick"><div>${'<b><i class="ic i-bolt"></i> ارسال فوری</b>اصالت کالا<b><i class="ic i-gamepad"></i> گارانتی معتبر</b>پشتیبانی هوشمند ۲۴/۷<b><i class="ic i-tag"></i> تخفیف ویژه گیمرها</b>'.repeat(4)}</div></div><div class="hero"><h1>GAME ON. <span style="color:#00f0ff">LEVEL UP.</span></h1><h2 style="margin:0 0 6px"><i class="ic i-gamepad"></i> تجهیزات گیمینگ حرفه‌ای</h2><p>ماوس، کیبورد، اسکین و جعبه‌ی کانتر؛ با ضمانت اصالت.</p><button class="btn pri" onclick="S.v='tickets';render()">پشتیبانی هوشمند ۲۴ ساعته</button>
 <div class="stats"><div><b data-n="${S.P.length}" data-s="+">0</b>محصول</div><div><b data-n="${S.P.reduce((a,p)=>a+p.s,0)}">0</b>کالای موجود</div><div><b>۱۲ ماه</b>گارانتی</div></div></div>
 <div class="brands"><span>HEADSHOT</span><span>DEFUSE</span><span>BOMBSITE</span><span>FLASHBANG</span><span>SMOKE</span></div><div class="chips">${cats.map(c=>`<button class="btn ${c===S.cat?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
 <div class="grid">${L.map(p=>`<div class="card" style="--rc:${RC[p.r]||'#00f0ff'}" onclick="openP(${p.id})"><div class="pic" style="background:linear-gradient(135deg,${p.g.split(',').map(c=>c+'55').join(',')})"><i class="ic i-${p.i}"></i>${stockTag(p)}</div><div class="cb"><b>${p.n}</b><span class="mut">${p.c}${p.r?' · <b style="color:var(--rc)">'+RL[p.r]+'</b>':''}</span>${(S.R[p.id]||[]).length?`<span class="stars">${stars(avg(p.id))} <span class="mut">(${fa(S.R[p.id].length)})</span></span>`:''}<span class="price">${fa(p.p)} تومان</span></div></div>`).join('')||'<p>محصولی پیدا نشد.</p>'}</div>`;
}
function openP(id){
 const p=S.P.find(x=>x.id===id),r=S.R[id]||[];
 S.sel=id;
 $('md').innerHTML=`<button class="btn x" onclick="closeM()"><i class="ic i-close"></i></button><div class="pd"><div><div class="pic" style="--rc:${RC[p.r]||'#00f0ff'};border-radius:18px;height:220px;font-size:96px;background:linear-gradient(135deg,${p.g.split(',').map(c=>c+'66').join(',')})"><i class="ic i-${p.i}"></i></div><p class="stars">${stars(avg(id))} <span class="mut">${r.length?fa(avg(id).toFixed(1)):'بدون امتیاز'}</span></p></div>
 <div><h2 style="margin:0">${p.n}</h2><div class="mut">${p.c}</div><div class="price" style="font-size:22px;margin:6px 0">${fa(p.p)} تومان</div>
 <p>${p.d}</p><table>${p.sp.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join('')}<tr><td>موجودی انبار</td><td style="color:${p.s?'var(--ok)':'var(--bad)'}">${p.s?fa(p.s)+' عدد':'ناموجود'}</td></tr></table>
 <button class="btn pri" style="width:100%;margin-top:10px" ${p.s?'':'disabled'} onclick="add(${id})">${p.s?'افزودن به سبد <i class="ic i-cart"></i>':'ناموجود'}</button></div></div>
 <h3>نظرات کاربران (${fa(r.length)})</h3>
 ${r.map(x=>`<div class="rev"><b>${esc(x.u)}</b> <span class="stars">${stars(x.r)}</span> <span class="mut">${x.d}</span><div>${esc(x.t)}</div></div>`).join('')||'<p class="mut">هنوز نظری ثبت نشده.</p>'}
 ${S.user?`<div class="rev"><select id="rr"><option value="5">★★★★★ عالی</option><option value="4">★★★★ خوب</option><option value="3">★★★ متوسط</option><option value="2">★★ ضعیف</option><option value="1">★ بد</option></select><textarea id="rt" rows="2" placeholder="نظر شما…"></textarea><button class="btn pri" onclick="addR(${id})">ثبت نظر</button></div>`:'<p><button class="btn" onclick="authM()">برای ثبت نظر وارد شوید</button></p>'}`;
 $('ov').classList.add('on');
}
const closeM=()=>$('ov').classList.remove('on');
function addR(id){const t=$('rt').value.trim();if(t.length<3)return toast('متن نظر کوتاه است');
 S.R[id]=(S.R[id]||[]).filter(x=>x.u!==S.user.name);S.R[id].unshift({u:S.user.name,r:+$('rr').value,t,d:today()});save();openP(id);render();toast('نظر شما ثبت شد ✅')}
function add(id){const p=S.P.find(x=>x.id===id),n=(S.cart[id]||0)+1;if(n>p.s)return toast('بیشتر از موجودی انبار نمی‌شود');S.cart[id]=n;save();const bt=window.event&&window.event.target&&window.event.target.closest&&window.event.target.closest('button');if(bt)fly(bt);render();const cb=$('cartB');cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump');toast('به سبد اضافه شد')}
function cartV(){
 const it=Object.keys(S.cart).map(id=>({p:S.P.find(x=>x.id==id),n:S.cart[id]})).filter(x=>x.p);
 const tot=it.reduce((a,x)=>a+x.p.p*x.n,0);
 $('dr').innerHTML=`<div class="row" style="justify-content:space-between"><h3>سبد خرید</h3><button class="btn" onclick="$('dr').classList.remove('on')"><i class="ic i-close"></i></button></div>
 ${it.map(x=>`<div class="rev"><b>${x.p.n}</b><div class="row">${fa(x.p.p*x.n)} تومان<span style="flex:1"></span><button class="btn" onclick="qty(${x.p.id},-1)"><i class="ic i-minus"></i></button>${fa(x.n)}<button class="btn" onclick="qty(${x.p.id},1)"><i class="ic i-plus"></i></button></div></div>`).join('')||'<p class="mut">سبد خالی است.</p>'}
 <h3>مجموع: ${fa(tot)} تومان</h3><button class="btn pri" style="width:100%" ${it.length?'':'disabled'} onclick="checkout()">پرداخت و ثبت سفارش</button>`;
 $('dr').classList.add('on')}
function qty(id,d){const p=S.P.find(x=>x.id===id),n=(S.cart[id]||0)+d;if(n>p.s)return toast('موجودی کافی نیست');if(n<=0)delete S.cart[id];else S.cart[id]=n;save();render();cartV()}
function checkout(){
 if(!S.user){$('dr').classList.remove('on');return authM()}
 const items=Object.keys(S.cart).map(id=>{const p=S.P.find(x=>x.id==id);return{id:p.id,n:p.n,q:S.cart[id],p:p.p}});
 if(items.some(x=>x.q>S.P.find(p=>p.id===x.id).s))return toast('موجودی تغییر کرده است');
 items.forEach(x=>S.P.find(p=>p.id===x.id).s-=x.q);
 const o={code:'CS-'+Math.floor(10000+Math.random()*89999),u:S.user.email,items,total:items.reduce((a,x)=>a+x.p*x.q,0),d:today(),status:'در حال پردازش'};
 S.O.unshift(o);S.cart={};save();$('dr').classList.remove('on');S.v='orders';render();toast('سفارش '+o.code+' ثبت شد ✅')}
function orders(){
 if(!S.user)return '<p>برای دیدن سفارش‌ها <button class="btn pri" onclick="authM()">وارد شوید</button></p>';
 const L=S.O.filter(o=>o.u===S.user.email);
 return '<h2>سفارش‌های من</h2>'+(L.map(o=>`<div class="rev"><b>${o.code}</b> · ${o.d} · <span style="color:var(--ok)">${o.status}</span>${o.items.map(i=>`<div class="mut">${i.n} × ${fa(i.q)}</div>`).join('')}<b>${fa(o.total)} تومان</b></div>`).join('')||'<p class="mut">سفارشی ندارید.</p>')}
function authM(mode){
 mode=mode||'in';
 $('md').innerHTML=`<button class="btn x" onclick="closeM()"><i class="ic i-close"></i></button><h2>${mode==='in'?'ورود':'ثبت‌نام'}</h2>${mode==='up'?'<input id="an" placeholder="نام">':''}<input id="ae" type="email" placeholder="ایمیل" dir="ltr"><input id="ap" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" dir="ltr"><button class="btn pri" style="width:100%" onclick="auth('${mode}')">${mode==='in'?'ورود':'ساخت حساب'}</button><p class="mut" style="text-align:center"><a href="javascript:void(0)" onclick="authM('${mode==='in'?'up':'in'}')">${mode==='in'?'حساب ندارید؟ ثبت‌نام':'حساب دارید؟ ورود'}</a></p>`;
 $('ov').classList.add('on')}
function auth(mode){
 const e=$('ae').value.trim().toLowerCase(),p=$('ap').value;
 if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6)return toast('ایمیل یا رمز نامعتبر است');
 const h=btoa(unescape(encodeURIComponent(p)));
 if(mode==='up'){const n=$('an').value.trim();if(!n)return toast('نام را وارد کنید');if(S.users[e])return toast('این ایمیل قبلا ثبت شده');S.users[e]={name:n,h};}
 else if(!S.users[e]||S.users[e].h!==h)return toast('ایمیل یا رمز اشتباه است');
 S.user={name:S.users[e].name,email:e};save();closeM();render();toast('خوش آمدید '+S.user.name)}
function tickets(){
 if(!S.user)return '<p>برای ارسال تیکت <button class="btn pri" onclick="authM()">وارد شوید</button></p>';
 const L=S.T.filter(t=>t.u===S.user.email),t=L.find(x=>x.id===S.tk)||L[0];
 return `<h2><i class="ic i-chat"></i> پشتیبانی هوشمند</h2><p class="mut">دستیار هوشمند درباره موجودی، ارسال، پیگیری سفارش، مرجوعی و گارانتی فوری پاسخ می‌دهد.</p>
 <div class="pd"><div><input id="ts1" placeholder="موضوع تیکت جدید"><textarea id="tm" rows="3" placeholder="مثلا: ماوس Headshot موجود است؟"></textarea><button class="btn pri" onclick="newT()">ارسال تیکت</button>${L.map(x=>`<div class="tk ${t&&x.id===t.id?'sel':''}" onclick="S.tk=${x.id};render()"><b>${esc(x.s)}</b><div class="mut">${x.d} · ${x.st}</div></div>`).join('')}</div>
 <div>${t?`<b>${esc(t.s)}</b><div class="chat">${t.m.map(m=>`<div class="m ${m.w}">${esc(m.t)}</div>`).join('')}${t.typing?'<div class="m b">در حال نوشتن…</div>':''}</div><div class="row"><input id="tr" style="flex:1" placeholder="پیام شما…" onkeydown="if(event.key==='Enter')reply(${t.id})"><button class="btn pri" onclick="reply(${t.id})">ارسال</button></div>`:'<p class="mut">تیکتی انتخاب نشده.</p>'}</div></div>`}
function newT(){const s=$('ts1').value.trim(),m=$('tm').value.trim();if(!s||!m)return toast('موضوع و متن را کامل کنید');
 const t={id:Date.now(),u:S.user.email,s,d:today(),st:'پاسخ داده شد',m:[{w:'u',t:m}]};S.T.unshift(t);S.tk=t.id;save();render();bot(t)}
function reply(id){const i=$('tr'),v=i.value.trim();if(!v)return;const t=S.T.find(x=>x.id===id);t.m.push({w:'u',t:v});save();render();bot(t)}
function bot(t){t.typing=1;render();setTimeout(()=>{t.typing=0;const r=answer(t.m[t.m.length-1].t);t.m.push({w:'b',t:r.t});t.st=r.h?'در انتظار پشتیبان انسانی':'پاسخ داده شد';save();render()},900)}
function answer(q){
 const x=q.replace(/[يى]/g,'ی').replace(/ك/g,'ک').toLowerCase();
 const has=(...w)=>w.some(k=>x.includes(k));
 const p=S.P.find(p=>p.n.toLowerCase().split(' ').some(w=>w.length>3&&x.includes(w))||x.includes(p.c));
 if(has('موجود','انبار','هست','stock')){
  if(p)return{t:p.s?`✅ «${p.n}» هم‌اکنون ${fa(p.s)} عدد در انبار موجود است. قیمت: ${fa(p.p)} تومان.`:`❌ متاسفانه «${p.n}» فعلا ناموجود است. به‌زودی تکمیل می‌شود.`};
  return{t:'نام محصول را بنویسید تا موجودی دقیق را بگویم. مثلا: «ماوس Headshot موجود است؟»'}}
 if(has('سفارش','پیگیری','کد','CS-'.toLowerCase())){const o=S.O.find(o=>o.u===S.user.email);
  return{t:o?`📦 آخرین سفارش شما ${o.code} (${o.d}) با وضعیت «${o.status}» است. مبلغ: ${fa(o.total)} تومان.`:'سفارشی با حساب شما پیدا نشد. ابتدا از فروشگاه خرید کنید.'}}
 if(has('ارسال','پست','تحویل','زمان'))return{t:'🚚 سفارش‌ها ظرف ۲۴ ساعت کاری ارسال می‌شوند. تحویل داخل شهر ۱ تا ۲ روز و سایر شهرها ۳ تا ۵ روز کاری است.'};
 if(has('مرجوع','برگشت','عودت','پس بدم'))return{t:'↩️ تا ۷ روز پس از دریافت، کالای بدون استفاده و در بسته‌بندی اصلی قابل مرجوع است.'};
 if(has('گارانتی','ضمانت','خراب'))return{t:p?`🛡️ گارانتی «${p.n}»: ${(p.sp.find(s=>s[0]==='گارانتی')||[0,'ندارد'])[1]}. برای خرابی، شماره سفارش را بفرستید.`:'🛡️ بیشتر کالاها ۶ تا ۲۴ ماه گارانتی دارند؛ نام محصول را بگویید.'};
 if(has('قیمت','چنده','تخفیف','پرداخت'))return{t:p?`💰 قیمت «${p.n}»: ${fa(p.p)} تومان.`:'قیمت‌ها در صفحه هر محصول درج شده و پرداخت هنگام ثبت سفارش انجام می‌شود.'};
 if(has('سلام','درود'))return{t:'سلام! 👋 چطور می‌توانم کمک کنم؟'};
 return{t:'پیام شما ثبت شد و به پشتیبان انسانی ارجاع شد؛ ظرف چند ساعت پاسخ می‌دهیم. 🙏',h:1}}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;render()});
$('q').oninput=e=>{S.q=e.target.value.trim();S.v='shop';render()};
$('cartB').onclick=cartV;$('ov').onclick=e=>{if(e.target.id==='ov')closeM()};
$('userB').onclick=()=>{if(S.user){if(confirm('خروج از حساب؟')){S.user=null;save();render()}}else authM()};
function fx(){
 const key=S.v+'|'+S.cat,fresh=key!==fx.k;fx.k=key;
 if(fresh){const a=$('app');a.classList.remove('vin');void a.offsetWidth;a.classList.add('vin');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.05});
  document.querySelectorAll('.card,.rev,.tk,.brands span').forEach((el,i)=>{el.style.setProperty('--d',(i%8)*70+'ms');el.classList.add('rv');io.observe(el)});
  document.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n,s=b.dataset.s||'';let t0=null;const stp=ts=>{t0=t0||ts;const k=Math.min(1,(ts-t0)/1100);b.textContent=fa(Math.round(n*(1-Math.pow(1-k,3))))+s;if(k<1)requestAnimationFrame(stp)};requestAnimationFrame(stp)})}
 else document.querySelectorAll('[data-n]').forEach(b=>b.textContent=fa(b.dataset.n)+(b.dataset.s||''));
}
function fly(el){const a=el.getBoundingClientRect(),b=$('cartB').getBoundingClientRect(),d=document.createElement('i');d.className='ic i-cart fly';d.style.left=(a.left+a.width/2)+'px';d.style.top=a.top+'px';document.body.appendChild(d);
 d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale(.3)',opacity:.2}],{duration:750,easing:'cubic-bezier(.5,-.3,.8,.5)'}).onfinish=()=>d.remove()}
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='perspective(700px) rotateY('+(x*10)+'deg) rotateX('+(-y*10)+'deg) translateY(-6px)'});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
render();
</script>
</body>
</html>
